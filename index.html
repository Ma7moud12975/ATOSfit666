<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="utf-8" />
  <title>ATOS fit</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#08080A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ATOS Fit" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="ATOS fit - Smart computer vision workout tracking and biomechanics analysis on your smartphone." />
  <link rel="icon" href="/assets/images/atosfit.png" />
  <link rel="manifest" href="/manifest.json" />
<!-- Load app pose config first -->
<script src="/mediapipe-config.js"></script>
<!-- Conditionally load MediaPipe Pose only when backend is 'mediapipe' -->
<script>
  (function(){
    try {
      console.log('🔧 Checking MediaPipe backend configuration...');
      console.log('MediaPipeConfig:', window.MediaPipeConfig);
      
      if (window.MediaPipeConfig && window.MediaPipeConfig.POSE_BACKEND === 'mediapipe') {
        console.log('📦 Loading MediaPipe Pose script...');
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js';
        s.onload = function() {
          console.log('✅ MediaPipe Pose script loaded successfully');
          console.log('🔍 Available in window:', {
            Pose: !!window.Pose,
            Camera: !!window.Camera,
            drawConnectors: !!window.drawConnectors,
            drawLandmarks: !!window.drawLandmarks
          });
        };
        s.onerror = function() {
          console.error('❌ Failed to load MediaPipe Pose script');
        };
        document.head.appendChild(s);
      } else {
        console.log('ℹ️ MediaPipe backend not selected, skipping script load');
      }
    } catch (e) {
      console.warn('Pose backend loader guard error:', e);
    }
  })();
</script>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <script type="module" src="/src/index.jsx"></script>
</body>

</html>
